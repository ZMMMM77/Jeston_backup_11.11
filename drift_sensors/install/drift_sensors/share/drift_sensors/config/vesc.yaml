# Copy of f1tenth_stack/config/vesc.yaml with one change: vesc_to_odom no longer publishes the
# odom->base_link TF, the EKF does. Start the car with
#   ros2 launch f1tenth_stack sick_bringup_launch.py vesc_config:=/home/nvidia/drift_sensors/config/vesc.yaml
/**:
  ros__parameters:
    speed_to_erpm_gain: 4300.0
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -0.8535
    steering_angle_to_servo_offset: 0.4805
    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_tf: false            # was true; the EKF owns odom->base_link now
    use_servo_cmd_to_calc_angular_velocity: true
    wheelbase: .25

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position
    max_acceleration: 2.5
    throttle_smoother_rate: 75.0
    max_servo_speed: 3.2
    servo_smoother_rate: 75.0
